# ------------------------------------------------------------------
# Edit the values below to customize your site. This is the only
# file most updates should require for site-wide info.
# ------------------------------------------------------------------
title: "Planetary Origins Lab"
group_name: "Planetary Origins Lab"
pi_name: "Prof. Charles J. Law"
tagline: "Planet formation, protoplanetary disks, and astrochemistry"
description: >-
  We study how planetary systems form — from the physical and chemical
  structure of protoplanetary disks to the exoplanets they eventually
  produce.
university: "University of Minnesota"
department: "Minnesota Institute for Astrophysics"
email: "law06855@umn.edu"
address: "116 Church Street S.E., Minneapolis, MN 55455"
twitter_url: ""
github_url: ""
scholar_url: ""

# Base URL / GitHub Pages settings — leave url blank for a
# <username>.github.io repo; set it if this is a project-page repo.
url: ""
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
permalink: /:categories/:title/

# Jekyll ignores any folder starting with "_" unless it's whitelisted
# here — this is what makes the files in _pages/ actually get built.
include: ["_pages"]

plugins:
  - jekyll-feed
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - pub_sources.yml
  - scripts/
