- name: "Alexis Riggs"
  role: "PhD Student"
  focus: "Disk chemistry, millimeter imaging"
  bio: >-
    Alexis is a PhD student working on high-resolution ALMA imaging
    of nearby protoplanetary disks. She is a member of the CHEER ALMA Large Program,
    an international collaboration investigating disks around Herbig stars. Her current
    research focuses on sulfur chemistry in these disks. Before graduate school, Alexis
    earned a bachelor’s degree in physics from Knox College. 
#    current project searches for kinematic signatures of embedded
