# One entry per group member, in any order — the People page sorts
# automatically by role (PI, Postdoc, PhD Student, Undergraduate,
# Alumni), and every card renders at the same size regardless of role.
#
# Fields:
#   name, role, focus  — focus is a short one-line tag under the role
#   bio                — 3-5 sentences: background + current work
#   avatar             — optional path under /assets/images/people/.
#                         Leave blank and everyone gets the same gold
#                         default-avatar.svg placeholder automatically
#                         (see the PI entry for how to point at a real
#                         photo instead — prof-example.svg is one).
#   cv                 — optional link to a CV (used for the PI)
#   links              — optional list of {label, url} pairs, e.g.
#                         Website, LinkedIn, GitHub, Google Scholar.
#                         Entirely optional per person — leave as `[]`
#                         for no links at all, or list just one or two.

- name: "Prof. Charles Law"
  role: "PI"
  focus: "Disk structure & planet formation"
  bio: >-
    Charles joined the faculty at the University of Minnesota
    in 2026. His research focuses on the physics and chemistry of
    star and planet formation, combining millimeter and infrared observations
    with chemical modeling to understand how planets assemble and acquire their properties.
    Previously, he was a NASA Hubble Fellowship Program
    Sagan Fellow at the University of Virginia and completed his PhD at
    Harvard University and the Center for Astrophysics | Harvard & Smithsonian.
#Charles is especially interested in what resolved disk imaging can teach us
#    about planet formation still in progress.
  avatar: "/assets/images/people/headshot_charles_law.png"
  cv: "/assets/cv/Charles-Law-CV.pdf"
  links:
    - label: "Website"
      url: "https://cse.umn.edu/mifa/charles-law"

