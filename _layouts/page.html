---
layout: default
---
<div class="page-wrap">
  <div class="page-head">
    {% if page.eyebrow %}<div class="section-eyebrow">{{ page.eyebrow }}</div>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="page-sub">{{ page.subtitle }}</p>{% endif %}
  </div>
  <div class="page-body prose">
    {{ content }}
  </div>
</div>
